name: Build & Release TransAs APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip the upload to Releases (build only)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    strategy:
      fail-fast: false
      matrix:
        arch:
          - armeabi-v7a
          - arm64-v8a
          - x86_64

    env:
      ANDROIDAPI: 34
      ANDROIDMINAPI: 21
      ANDROID_NDK_VERSION: 25.2.9519653
      KEYSTORE_FILE: ${{ github.workspace }}/transas-release.jks

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up OpenJDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux host build libraries (Kivy SDL2 stack)
        run: |
          set -euo pipefail
          PKGS=(libffi-dev libssl-dev libsqlite3-dev libpango1.0-dev
                libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
                libgstreamer1.0-dev libunwind-dev libasound2-dev
                unzip p7zip-full)
          sudo apt-get update -q || (sleep 8 && sudo apt-get update -q)
          sudo apt-get install -y --fix-broken --no-install-recommends "${PKGS[@]}"
          missing=()
          for p in "${PKGS[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$p" 2>/dev/null \
                 | grep -q 'install ok installed'; then
              missing+=("$p")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing or half-installed packages after apt: ${missing[*]}" >&2
            exit 1
          fi
          echo "::notice::All ${#PKGS[@]} required packages installed OK."

      - name: Install Python deps (Cython pin + buildozer)
        run: |
          python -m pip install --upgrade pip wheel
          pip install 'Cython>=0.29.36,<3.0.0' buildozer

      # 3. Android SDK - Using v4 with CORRECT inputs
      - name: Setup Android SDK
        id: setup_android
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 13114758
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROIDAPI }}
            build-tools;34.0.0
            ndk;${{ env.ANDROID_NDK_VERSION }}
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Expose Android SDK paths for buildozer / p4a / Gradle
        id: expose_sdk
        run: |
          set -euo pipefail
          # v4 sets ANDROID_HOME in the environment
          SDK="${ANDROID_HOME:-}"
          
          if [[ -z "${SDK}" ]]; then
            echo "::error::ANDROID_HOME not set by setup-android@v4"
            exit 2
          fi
          
          echo "::notice::Using Android SDK at: ${SDK}"
          
          # Verify key directories exist
          if [[ ! -d "${SDK}/platforms" ]]; then
            echo "::error::${SDK}/platforms not found"
            ls -la "${SDK}/" || true
            exit 3
          fi
          
          if [[ ! -d "${SDK}/ndk/${ANDROID_NDK_VERSION}" ]]; then
            echo "::error::NDK ${ANDROID_NDK_VERSION} not found in ${SDK}/ndk"
            echo "::notice::Available NDKs:"
            ls -la "${SDK}/ndk/" || true
            exit 4
          fi
          
          # Export all SDK paths
          echo "ANDROIDSDK=${SDK}"        >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK}"      >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK}"  >> "$GITHUB_ENV"
          echo "ANDROIDNDK=${SDK}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          
          echo "::notice::✓ ANDROIDSDK=${SDK}"
          echo "::notice::✓ ANDROIDNDK=${SDK}/ndk/${ANDROID_NDK_VERSION}"

      - name: Decode release keystore from secret (soft-fail)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set +e
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::warning::KEYSTORE_BASE64 missing — continuing without release signing"
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_FILE}" || {
            echo "::warning::base64 decode failed — continuing"
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"; exit 0
          fi
          chmod 600 "${KEYSTORE_FILE}"
          if ! keytool -list -v -keystore "${KEYSTORE_FILE}" \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" >/dev/null 2>&1; then
            echo "::warning::keystore unlock failed — continuing"
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          echo "::notice::Release keystore OK"

      - name: Activate release signing in buildozer.spec
        if: env.HAS_KEYSTORE == 'true'
        run: |
          set -euo pipefail
          sed -i \
            -e 's|^# android\.keystore = .*|android.keystore = %(source.dir)s/transas-release.jks|' \
            -e 's|^# android\.keyalias = .*|android.keyalias = transas|' \
            buildozer.spec
          grep -E '^\s*android\.(keystore|keyalias)' buildozer.spec || {
            echo "::error::sed did not activate keystore lines"
            exit 3
          }

      - name: Build APK (${{ matrix.arch }})
        env:
          # CRITICAL FIX (iteration 21):
          # We intentionally do NOT keep ANDROIDSDK in this env block. On
          # GitHub-hosted runners the `$GITHUB_ENV` relay sometimes resolves
          # `${{ env.ANDROIDSDK }}` to an empty string at this step, which
          # makes buildozer / p4a see a literal `$ANDROIDSDK` placeholder and
          # try `${cwd}/$ANDROIDSDK/tools/bin/sdkmanager` — surfacing the
          # ClassNotFoundException for SdkManagerCli after a misleading
          # "Wrong version in preinstalled sdkmanager" warning.
          #
          # Instead we keep ANDROID_HOME here (which @v4 reliably writes to
          # $GITHUB_ENV) and re-export ANDROIDSDK explicitly in the bash
          # run block below, where the export actually lands in the
          # subprocess env that buildozer / p4a consult.
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROIDAPI: ${{ env.ANDROIDAPI }}
          ANDROIDNDK: ${{ env.ANDROIDNDK }}
          P4A_RELEASE_KEYSTORE: ${{ env.KEYSTORE_FILE }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEY_PASSWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # CRITICAL FIX (iteration 21): force-export ANDROIDSDK here, in
          # bash, BEFORE invoking buildozer. The GH Actions env: block above
          # only sees ANDROID_HOME reliably (set by setup-android@v4 in
          # $GITHUB_ENV). Buildozer / p4a's os.environ['ANDROIDSDK'] reads
          # ONLY the bash process env, NOT the GH Actions step env directly,
          # so we must mirror ANDROID_HOME into ANDROIDSDK in the same
          # shell that invokes buildozer. Without this, p4a falls back to
          # os.path.join(cwd, '$ANDROIDSDK', 'tools', 'bin', 'sdkmanager')
          # and emits the misleading SdkManagerCli ClassNotFoundException.
          export ANDROIDSDK="${ANDROID_HOME}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          {
            echo "::notice::Build APK environment:"
            echo "::notice::  ANDROIDSDK      = ${ANDROIDSDK}"
            echo "::notice::  ANDROID_HOME    = ${ANDROID_HOME}"
            echo "::notice::  ANDROID_SDK_ROOT= ${ANDROID_SDK_ROOT}"
            echo "::notice::  ANDROIDNDK      = ${ANDROIDNDK}"
            echo "::notice::  matrix.arch     = ${{ matrix.arch }}"
          }
          # CRITICAL FIX (iteration 23):
          # setup-android@v4 installs cmdline-tools under a versioned
          # directory (${ANDROIDSDK}/cmdline-tools/13114758/...). But
          # python-for-android's pre-flight check that runs BEFORE
          # `android.skip_update` has any effect expects the modern
          # "latest" layout (${ANDROIDSDK}/cmdline-tools/latest/bin/
          # sdkmanager) and aborts loudly otherwise:
          #   sdkmanager path "<sdk>/tools/bin/sdkmanager" does not exist
          # Adding the alias symlink below satisfies p4a's expectation
          # without touching the @v4-installed bits. The cmdline-tools
          # wrapper script resolves `../lib/...` JARs RELATIVE TO ITS
          # OWN DIRECTORY, so we symlink the WHOLE versioned directory,
          # not just the sdkmanager binary — that preserves classpath
          # resolution and prevents the ClassNotFoundException
          # resurface.
          ln -sfn 13114758 "${ANDROIDSDK}/cmdline-tools/latest"
          echo "::notice::Linked ${ANDROIDSDK}/cmdline-tools/latest -> 13114758"
          bash scripts/prepare_cover.sh
          buildozer --verbose android debug \
            arch=${{ matrix.arch }} \
            2>&1 | tee buildozer-${{ matrix.arch }}.log
          rc=${PIPESTATUS[0]}
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::buildozer exited with status $rc — APK NOT produced"
            exit "$rc"
          fi

      - name: Find built APK
        id: find_apk
        run: |
          APK=$(find bin -maxdepth 1 -name "transas-*.apk" \
                  -path "*${{ matrix.arch }}*" -print -quit)
          if [[ -z "${APK}" ]]; then
            echo "::error::No APK found for arch=${{ matrix.arch }} under bin/"
            ls -la bin/ || true
            exit 1
          fi
          echo "apk_path=${APK}" >> "$GITHUB_OUTPUT"
          echo "Built APK: ${APK}  ($(du -h "${APK}" | cut -f1))"

      - name: Verify APK signature and badging
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          PATH: ${{ env.ANDROIDSDK }}/build-tools/34.0.0:${{ env.PATH }}
        run: |
          APK="${{ steps.find_apk.outputs.apk_path }}"
          apksigner verify -v "${APK}"
          aapt2 dump badging "${APK}" 2>/dev/null | head -10

      - name: Upload APK to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TransAs ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.find_apk.outputs.apk_path }}
            buildozer-${{ matrix.arch }}.log

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: transas-${{ matrix.arch }}-${{ github.ref_name }}
          path: |
            ${{ steps.find_apk.outputs.apk_path }}
            buildozer-${{ matrix.arch }}.log
          if-no-files-found: error
