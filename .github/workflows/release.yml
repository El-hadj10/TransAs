name: Build & Release TransAs APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip the upload to Releases (build only)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    strategy:
      fail-fast: false
      matrix:
        arch:
          - armeabi-v7a
          - arm64-v8a
          - x86_64

    env:
      ANDROIDAPI: 34
      ANDROIDMINAPI: 21
      # CRITICAL FIX (iter-35): restore NDK r25c (25.2.9519653).
      # p4a strictly requires NDK >= 25 — iter-34's r23b attempt crashed in
      # 200 s with `The minimum supported NDK version is 25`. To work around
      # clang-14's strict rejection of autoconf's GCC-only
      # `--print-multi-os-directory` probe (used by libffi / openssl
      # configure), the Build APK step now installs host gcc and exports
      # `CC_FOR_BUILD=gcc` so autoconf's capability probes use gcc instead
      # of clang while the actual cross-compile still uses NDK clang-14.
      # Must be the NDK that buildozer.spec pins (28.0.13004108): the Build
      # APK step exports this directory as ANDROIDNDK and rewrites
      # android.ndk_path with it, so a different major version here makes
      # p4a look for a toolchain that is not installed.
      ANDROID_NDK_VERSION: 28.0.13004108
      # cmdline-tools (a.k.a. "tools") pin — DRY source for both
      # setup-android@v4's input AND the iter-24 alias symlink below.
      # Bump this here to upgrade the whole pipeline; bump-and-forget.
      CMDLINE_TOOLS_VERSION: 13114758
      KEYSTORE_FILE: ${{ github.workspace }}/transas-release.jks

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Pillow 13 (the first release free of the 12.x OSV CVEs) requires
      # Python >= 3.11, so the host interpreter that resolves
      # requirements.txt must not stay on 3.10.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up OpenJDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux host build libraries (Kivy SDL2 stack)
        run: |
          set -euo pipefail
          PKGS=(libffi-dev libssl-dev libsqlite3-dev libpango1.0-dev
                libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
                libgstreamer1.0-dev libunwind-dev libasound2-dev
                unzip p7zip-full
                # CRITICAL FIX (iter-35): host gcc + g++ + build-essential.
                # NDK r25c ships ONLY clang-14 (no gcc). When autoconf
                # scripts probe `CC --print-multi-os-directory` to detect
                # host lib dirs, clang-14 exits with `unsupported option`
                # instead of returning a path. Export CC_FOR_BUILD=gcc in
                # the Build APK step so autoconf uses HOST gcc for tooling
                # capability probes while the cross-compile remains clang-14.
                gcc g++ build-essential)
          sudo apt-get update -q || (sleep 8 && sudo apt-get update -q)
          sudo apt-get install -y --fix-broken --no-install-recommends "${PKGS[@]}"
          missing=()
          for p in "${PKGS[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$p" 2>/dev/null \
                 | grep -q 'install ok installed'; then
              missing+=("$p")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing or half-installed packages after apt: ${missing[*]}" >&2
            exit 1
          fi
          echo "::notice::All ${#PKGS[@]} required packages installed OK."

      - name: Install Python deps (project + Cython pin + buildozer)
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install 'Cython>=0.29.36,<3.0.0' buildozer

      # 3. Android SDK - Using v4 with CORRECT inputs
      - name: Setup Android SDK
        id: setup_android
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: ${{ env.CMDLINE_TOOLS_VERSION }}
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROIDAPI }}
            build-tools;34.0.0
            ndk;${{ env.ANDROID_NDK_VERSION }}
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Expose Android SDK paths for buildozer / p4a / Gradle
        id: expose_sdk
        run: |
          set -euo pipefail
          # v4 sets ANDROID_HOME in the environment
          SDK="${ANDROID_HOME:-}"
          
          if [[ -z "${SDK}" ]]; then
            echo "::error::ANDROID_HOME not set by setup-android@v4"
            exit 2
          fi
          
          echo "::notice::Using Android SDK at: ${SDK}"
          
          # Verify key directories exist
          if [[ ! -d "${SDK}/platforms" ]]; then
            echo "::error::${SDK}/platforms not found"
            ls -la "${SDK}/" || true
            exit 3
          fi
          
          if [[ ! -d "${SDK}/ndk/${ANDROID_NDK_VERSION}" ]]; then
            echo "::error::NDK ${ANDROID_NDK_VERSION} not found in ${SDK}/ndk"
            echo "::notice::Available NDKs:"
            ls -la "${SDK}/ndk/" || true
            exit 4
          fi
          
          # Export all SDK paths
          echo "ANDROIDSDK=${SDK}"        >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK}"      >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK}"  >> "$GITHUB_ENV"
          echo "ANDROIDNDK=${SDK}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          
          echo "::notice::✓ ANDROIDSDK=${SDK}"
          echo "::notice::✓ ANDROIDNDK=${SDK}/ndk/${ANDROID_NDK_VERSION}"

      - name: Decode release keystore from secret (soft-fail)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set +e
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::warning::KEYSTORE_BASE64 missing — continuing without release signing"
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_FILE}" || {
            echo "::warning::base64 decode failed — continuing"
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"; exit 0
          fi
          chmod 600 "${KEYSTORE_FILE}"
          if ! keytool -list -v -keystore "${KEYSTORE_FILE}" -storepass "${KEYSTORE_PASSWORD:-}" >/dev/null 2>&1; then
            echo "::warning::keystore unlock failed — continuing"
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          echo "::notice::Release keystore OK"

      - name: Activate release signing in buildozer.spec
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          set -euo pipefail
          sed -i \
            -e 's|^# android\.keystore = .*|android.keystore = %(source.dir)s/transas-release.jks|' \
            -e 's|^# android\.keyalias = .*|android.keyalias = transas|' \
            buildozer.spec
          grep -E '^\s*android\.(keystore|keyalias)' buildozer.spec || {
            echo "::error::sed did not activate keystore lines"
            exit 3
          }

      - name: Build APK (${{ matrix.arch }})
        env:
          # CRITICAL FIX (iteration 21):
          # We intentionally do NOT keep ANDROIDSDK in this env block. On
          # GitHub-hosted runners the `$GITHUB_ENV` relay sometimes resolves
          # `${{ env.ANDROIDSDK }}` to an empty string at this step, which
          # makes buildozer / p4a see a literal `$ANDROIDSDK` placeholder and
          # try `${cwd}/$ANDROIDSDK/tools/bin/sdkmanager` — surfacing the
          # ClassNotFoundException for SdkManagerCli after a misleading
          # "Wrong version in preinstalled sdkmanager" warning.
          #
          # Instead we keep ANDROID_HOME here (which @v4 reliably writes to
          # $GITHUB_ENV) and re-export ANDROIDSDK explicitly in the bash
          # run block below, where the export actually lands in the
          # subprocess env that buildozer / p4a consult.
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROIDAPI: ${{ env.ANDROIDAPI }}
          ANDROIDNDK: ${{ env.ANDROIDNDK }}
          P4A_RELEASE_KEYSTORE: ${{ env.KEYSTORE_FILE }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEY_PASSWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # CRITICAL FIX (iteration 21): force-export ANDROIDSDK here, in
          # bash, BEFORE invoking buildozer. The GH Actions env: block above
          # only sees ANDROID_HOME reliably (set by setup-android@v4 in
          # $GITHUB_ENV). Buildozer / p4a's os.environ['ANDROIDSDK'] reads
          # ONLY the bash process env, NOT the GH Actions step env directly,
          # so we must mirror ANDROID_HOME into ANDROIDSDK in the same
          # shell that invokes buildozer. Without this, p4a falls back to
          # os.path.join(cwd, '$ANDROIDSDK', 'tools', 'bin', 'sdkmanager')
          # and emits the misleading SdkManagerCli ClassNotFoundException.
          export ANDROIDSDK="${ANDROID_HOME}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          # CRITICAL FIX (iteration 28): five-way NDK env lock.
          # Iter-27's buildozer env dump (captured by our `if: always()`
          # artifact upload — see run 29192894447 logs) revealed that
          # P4A_NDK_DIR / ANDROID_NDK / ANDROIDNDK were correctly r25c,
          # but ANDROID_NDK_HOME and ANDROID_NDK_ROOT remained pointed
          # at `27.3.13750724` (r27) — independently set by
          # setup-android@v4 to whatever its `latest` NDK install is,
          # NOT to the version we asked for. Compilers / CMake /
          # Gradle that read ANDROID_NDK_HOME were then using r27
          # while p4a used r25c — a hard link-time mismatch.
          #
          # Force ALL known NDK env vars to a single NDK_DIR below
          # buildozer's invocation, in the same bash process. Bash-
          # level `export` carries higher precedence than any value
          # propagated earlier via $GITHUB_ENV by @v4. DRYed through
          # an intermediate `NDK_DIR` so future bumps of
          # ANDROID_NDK_VERSION ripple through to all 5 names
          # simultaneously.
          NDK_DIR="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          # Defensive guard: if the @v4-installed NDK dir is missing
          # for any reason, fail LOUD with a distinct exit code (7)
          # so post-mortem is unambiguous. Do NOT silently fall through.
          [[ -d "${NDK_DIR}" ]] || {
            echo "::error::NDK_DIR=${NDK_DIR} not present after setup-android@v4"
            echo "::notice::Available NDKs:"
            ls -la "${ANDROID_HOME}/ndk/" 2>/dev/null || true
            exit 7
          }
          export ANDROIDNDK="${NDK_DIR}"
          export ANDROID_NDK="${NDK_DIR}"
          export P4A_NDK_DIR="${NDK_DIR}"
          export ANDROID_NDK_HOME="${NDK_DIR}"
          export ANDROID_NDK_ROOT="${NDK_DIR}"
          export ANDROID_STL="c++_shared"
          # Sixth legacy alias (iter-29 reviewer's NIT): pre-NDK-r12
          # autoconf, older cmake modules, and a handful of kvm wrapper
          # scripts read NDK_ROOT as the canonical name rather than
          # ANDROID_NDK_ROOT. Costs nothing in buildozer/p4a but
          # future-proofs against any p4a recipe invoking an
          # autoconf-using dependency. Belt to iter-28's 5-way
          # suspenders.
          export NDK_ROOT="${NDK_DIR}"
          {
            echo "::notice::Build APK environment:"
            echo "::notice::  ANDROIDSDK      = ${ANDROIDSDK}"
            echo "::notice::  ANDROID_HOME    = ${ANDROID_HOME}"
            echo "::notice::  ANDROID_SDK_ROOT= ${ANDROID_SDK_ROOT}"
            echo "::notice::  NDK_DIR         = ${NDK_DIR}"
            echo "::notice::  ANDROIDNDK      = ${ANDROIDNDK}"
            echo "::notice::  ANDROID_NDK     = ${ANDROID_NDK}"
            echo "::notice::  ANDROID_STL     = ${ANDROID_STL}"
            echo "::notice::  P4A_NDK_DIR     = ${P4A_NDK_DIR}"
            echo "::notice::  ANDROID_NDK_HOME= ${ANDROID_NDK_HOME}"
            echo "::notice::  ANDROID_NDK_ROOT= ${ANDROID_NDK_ROOT}"
            echo "::notice::  NDK_ROOT        = ${NDK_ROOT}"
            echo "::notice::  CTV             = ${CMDLINE_TOOLS_VERSION}"
            echo "::notice::  matrix.arch     = ${{ matrix.arch }}"
          }
          # CRITICAL FIX (iteration 24):
          # buildozer's android target (buildozer/targets/android.py ~L276)
          # constructs the sdkmanager path as:
          #   os.path.join(self.android_sdk_dir, 'tools', 'bin', 'sdkmanager')
          # unconditionally — there is NO modern /cmdline-tools/latest
          # fallback in this buildozer release (verified against
          # kivy/buildozer master + RemiFan/buildozer master via direct
          # source fetch). @v4 however only installs cmdline-tools under
          #   ${ANDROIDSDK}/cmdline-tools/${CMDLINE_TOOLS_VERSION}/
          # never under ${ANDROIDSDK}/tools/. Without a bridge symlink,
          # p4a's pre-flight check aborts with:
          #   "sdkmanager path <sdk>/tools/bin/sdkmanager does not exist"
          # BEFORE `android.skip_update` has any effect.
          #
          # Two alias symlinks bridge modern AND legacy consumers:
          #   1) ${ANDROIDSDK}/tools -> cmdline-tools/${CTV}  (legacy p4a)
          #   2) ${ANDROIDSDK}/cmdline-tools/latest -> ${CTV} (modern Gradle)
          # We alias the WHOLE versioned parent directory (not just the
          # sdkmanager binary) so the wrapper script's RELATIVE ../lib
          # classpath lookup continues to resolve to the JAR directory.
          # CTV is sourced from the job-level env (same value as the
          # setup-android@v4 input) — DRY, single source of truth.
          CTV="${CMDLINE_TOOLS_VERSION:-}"
          # iter-25 quality fix (per code-reviewer verdict): guard ORDER MATTERS
          # under `set -u`. Use `:s/-` empty-default to avoid a crash on UNSET
          # env, THEN test for non-empty. Two distinct error paths:
          [[ -n "${CTV}" ]] || {
            echo "::error::CMDLINE_TOOLS_VERSION env empty or unset"
            exit 6
          }
          [[ -d "${ANDROIDSDK}/cmdline-tools/${CTV}" ]] || {
            echo "::error::cmdline-tools/${CTV} not installed by setup-android@v4"
            ls -la "${ANDROIDSDK}/cmdline-tools/" || true
            exit 5
          }
          # If a real `tools/` directory already exists (rare; @v4 doesn't
          # create one), force-remove it so `ln -sfn` can place the alias.
          [[ -L "${ANDROIDSDK}/tools" || ! -e "${ANDROIDSDK}/tools" ]] \
              || rm -rf "${ANDROIDSDK}/tools"
          ln -sfn "${ANDROIDSDK}/cmdline-tools/${CTV}" "${ANDROIDSDK}/tools"
          ln -sfn "${CTV}" "${ANDROIDSDK}/cmdline-tools/latest"
          echo "::notice::Linked ${ANDROIDSDK}/tools -> cmdline-tools/${CTV}"
          echo "::notice::Linked ${ANDROIDSDK}/cmdline-tools/latest -> ${CTV}"
          # CRITICAL FIX: patch local p4a so python3 and hostpython3 are both
          # pinned to 3.11.11 and Cython selectors are collapsed to 0.29.36.
          set -euo pipefail
          P4A_LOCAL="$(pwd)/.local/python-for-android"
          rm -rf "${P4A_LOCAL}"
          git clone --depth 1 --quiet \
              https://github.com/kivy/python-for-android.git "${P4A_LOCAL}"
          P4A_SHA=$(git -C "${P4A_LOCAL}" rev-parse --short HEAD)
          echo "::notice::Cloned p4a (depth=1) @ ${P4A_SHA} → ${P4A_LOCAL}"
          # Sed-patch BOTH hardcoded selectors to the strict pinned form.
          # p4a stores these selectors across ALL text formats —
          # `.py`, `.toml` (pyproject.toml), `setup.py`, `.cfg`, `requirements.txt`,
          # shell snippets inside recipes. Iter-33's first attempt restricted
          # to `-name '*.py'` and missed `recipes/android/src/pyproject.toml`
          # (which holds the `Cython>=0.29,<3.1` line) → exit 8 → crash in <2 min.
          # Iter-33 fix: drop the file-type restriction entirely. Sed EACH text
          # file in pythonforandroid (no harm doing sed on non-matching files).
              sed -i "s/version = '3.14.2'/version = '3.11.11'/g" \
                "${P4A_LOCAL}/pythonforandroid/recipes/python3/__init__.py"
              sed -i 's/version = "3.14.2"/version = "3.11.11"/g' \
                "${P4A_LOCAL}/pythonforandroid/recipes/hostpython3/__init__.py"
            find "${P4A_LOCAL}/pythonforandroid" -type f -exec \
                sed -i 's/Cython<3\.2/Cython==0.29.36/g' {} +
            find "${P4A_LOCAL}/pythonforandroid" -type f -exec \
                sed -i 's/Cython>=0\.29,<3\.1/Cython==0.29.36/g' {} +
          # NDK 28 ships libc++ only. p4a's SDL2 bootstrap leaves APP_STL
          # commented out (ndk-build then adds -stdlib=libstdc++, removed in
          # NDK r27 → undefined operator new/delete), and even with
          # APP_STL=c++_shared no C++ runtime reaches a -shared link (zero
          # -lc++_shared in run 43950414637). libthorvg is built by meson,
          # whose cross file takes link args from LDFLAGS, so ndk-build flags
          # never reach it either (run 43953118690: undefined std::__ndk1::*).
          # scripts/patch_p4a_stl.py applies all three fixes, verifies its own
          # writes and is idempotent — the same script is used for local builds.
          python scripts/patch_p4a_stl.py "${P4A_LOCAL}"
          # Defensive verification: if either selector survives, the build
          # would still install Cython 3.x. Fail loud with a distinct exit
          # code so the post-mortem is unambiguous.
          REMAINING=$(grep -rnE 'Cython<3\.2|Cython>=0\.29,<3\.1' \
              "${P4A_LOCAL}/pythonforandroid" 2>/dev/null || true)
          if [[ -n "${REMAINING}" ]]; then
              echo "::error::p4a sed-patch FAILED — selectors survived:"
              echo "${REMAINING}"
              exit 8
          fi
          # Echo proof-of-life for the patch so it's grep-able in logs.
              echo "::notice::p4a patched OK: python3/hostpython3=3.11.11 and Cython==0.29.36"
              grep -rnE "version = '3\.11\.11'|version = \"3\.11\.11\"|Cython==0\.29\.36" "${P4A_LOCAL}/pythonforandroid" \
              | head -5 | sed 's/^/::notice::    /'
          # CRITICAL FIX (iter-36): NDK clang shim wrapper for autoconf probes.
          # libffi / openssl / sqlite / libxml2 configure scripts probe
          # `$CC --print-multi-os-directory` to detect multiarch lib dirs.
          # clang-14 strictly rejects this GCC-only flag with `unsupported
          # option` + exit 1, aborting configure pre-build. Confirmed in:
          #   iter-33v2 run 29204253225 (clang-14 yells at libffi)
          #   iter-35 run 29205113461 (CC_FOR_BUILD=gcc exported but
          #     libffi's tune.c uses $CC, not $CC_FOR_BUILD, for this probe
          #     — hence gcc env passed through and clang probe still failed)
          # Solution: install a /bin/bash wrapper AT the NDK clang binary
          # path which returns the synthetic path "../lib" when invoked with
          # -print-multi-os-directory, and execs the original binary for
          # every other call. Idempotent (re-runs skip if shim is in place).
          # Reversible (the .real file is left untouched on disk).
          CLANG_BIN="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          if [[ -f "${CLANG_BIN}" && ! -f "${CLANG_BIN}.real" ]]; then
              mv "${CLANG_BIN}" "${CLANG_BIN}.real"
              cat << 'EOF' > "${CLANG_BIN}"
          #!/bin/bash
          # Clang shim (iter-36). Intercept the GCC-only
          # `-print-multi-os-directory` probe that libffi/openssl/sqlite
          # configure scripts use to detect multiarch lib dirs. clang-14
          # rejects it as `unsupported option`; we synthesize the path
          # `../lib` (the same answer stock GCC gives on Ubuntu). All other
          # invocations (real cross-compile calls) pass through to .real.
          for arg in "$@"; do
              if [[ "${arg}" == "-print-multi-os-directory" ]]; then
                  echo "../lib"
                  exit 0
              fi
          done
          SHIM_DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "${SHIM_DIR}/clang.real" "$@"
          EOF
              chmod +x "${CLANG_BIN}"
              echo "::notice::iter 36 clang shim installed at ${CLANG_BIN}"
          else
              echo "::notice::iter 36 clang shim already in place (skipped re-install)"
          fi
          bash scripts/prepare_cover.sh
          # CRITICAL FIX (iter-35): route `--print-multi-os-directory`-style
          # autoconf probes through HOST gcc instead of NDK clang-14.
          # CC_FOR_BUILD is the conventional autoconf env var for "compiler
          # that runs host-side tooling probes" — distinct from CC (the
          # cross-compiler). GNU autoconf's libFF_CHECK_LONG_DOUBLE / similar
          # shell probes honor CC_FOR_BUILD only for the host probe parts.
          # CONFIG_SHELL=/bin/bash sidesteps dash-default issues ubuntu22 has
          # with complex autoconf variable expansions.
          export CC_FOR_BUILD="${CC_FOR_BUILD:-gcc}"
          export CONFIG_SHELL=/bin/bash
          echo "::notice::iter 35 CC_FOR_BUILD=${CC_FOR_BUILD} CONFIG_SHELL=${CONFIG_SHELL}"
          # buildozer.spec pins the SDK/NDK to the repository-local
          # `.android-sdk` used on the developer machine. That directory is
          # gitignored and absent on the runner, so point the two properties
          # at the toolchain setup-android@v4 installed and exported here.
          sed -i "s|^android.sdk_path = .*|android.sdk_path = ${ANDROIDSDK}|" buildozer.spec
          sed -i "s|^android.ndk_path = .*|android.ndk_path = ${ANDROIDNDK}|" buildozer.spec
          echo "::notice::buildozer.spec SDK=${ANDROIDSDK} NDK=${ANDROIDNDK}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            buildozer --verbose android debug \
              arch=${{ matrix.arch }} \
              2>&1 | tee buildozer-${{ matrix.arch }}.log
          else
            buildozer --verbose android debug \
              arch=${{ matrix.arch }} \
              2>&1 | tee buildozer-${{ matrix.arch }}.log
          fi
          rc=${PIPESTATUS[0]}
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::buildozer exited with status $rc — APK NOT produced"
            exit "$rc"
          fi

      - name: Find built APK
        id: find_apk
        run: |
          APK=$(find bin -maxdepth 1 -name "transas-*.apk" \
                  -path "*${{ matrix.arch }}*" -print -quit)
          if [[ -z "${APK}" ]]; then
            echo "::error::No APK found for arch=${{ matrix.arch }} under bin/"
            ls -la bin/ || true
            exit 1
          fi
          echo "apk_path=${APK}" >> "$GITHUB_OUTPUT"
          echo "Built APK: ${APK}  ($(du -h "${APK}" | cut -f1))"

      - name: Verify APK signature and badging
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          PATH: ${{ env.ANDROID_SDK_ROOT }}/build-tools/34.0.0:${{ env.PATH }}
        run: |
          APK="${{ steps.find_apk.outputs.apk_path }}"
          apksigner verify -v "${APK}"
          aapt2 dump badging "${APK}" 2>/dev/null | head -10

      - name: Upload APK to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TransAs ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.find_apk.outputs.apk_path }}
            buildozer-${{ matrix.arch }}.log

      # CRITICAL FIX (iteration 27): upload even on failure so we capture
      # buildozer-$arch.log for post-mortem. Without `if: always()` AND
      # `if-no-files-found: warn`, the buildozer log is lost whenever
      # buildozer crashes (and we can't diagnose the next failure layer).
      - name: Upload build artifacts (APK + buildozer log; survives failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transas-${{ matrix.arch }}-${{ github.ref_name }}
          path: |
            ${{ steps.find_apk.outputs.apk_path }}
            buildozer-${{ matrix.arch }}.log
          if-no-files-found: warn
